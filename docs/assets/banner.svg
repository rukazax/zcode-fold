<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F0C"/>
      <stop offset="0.55" stop-color="#101813"/>
      <stop offset="1" stop-color="#0B0F0C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8EE6A8"/>
      <stop offset="1" stop-color="#4FBF79"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#203027" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="90" r="130" fill="#8EE6A8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1120" cy="330" r="90" fill="#4FBF79" opacity="0.10" filter="url(#glow)"/>

  <g transform="translate(64 58)">
    <rect width="46" height="46" rx="14" fill="#8EE6A8" opacity="0.14"/>
    <text x="23" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#8EE6A8">Z</text>
    <text x="62" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#8EE6A8">MOBILE CLIENT</text>
